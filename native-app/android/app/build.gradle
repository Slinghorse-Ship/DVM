plugins { id 'com.android.application' }

android {
    namespace 'de.deinvereinsmanager.app'
    compileSdk 36
    defaultConfig {
        applicationId 'de.deinvereinsmanager.app'
        minSdk 26
        targetSdk 36
        versionCode 2
        versionName '1.0.1'
    }
    buildFeatures { buildConfig true }
    flavorDimensions += 'payments'
    productFlavors {
        standard { dimension 'payments' }
        terminal { dimension 'payments' }
    }
    defaultConfig {
        def affiliate = providers.gradleProperty('dvmSumUpAffiliateKey').orElse('').get()
        if (affiliate && !(affiliate ==~ /sup_afk_[A-Za-z0-9_-]+/)) throw new GradleException('Invalid SumUp affiliate key')
        buildConfigField 'String', 'SUMUP_AFFILIATE_KEY', '"' + affiliate + '"'
    }
    sourceSets { main.assets.srcDirs += file('../../shared') }
    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release { minifyEnabled false }
    }
}

dependencies { coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'; implementation 'androidx.activity:activity:1.11.0'; terminalImplementation platform('androidx.compose:compose-bom:2024.09.00'); androidTestImplementation platform('androidx.compose:compose-bom:2024.09.00'); terminalImplementation 'com.sumup:merchant-sdk:7.1.0' }
