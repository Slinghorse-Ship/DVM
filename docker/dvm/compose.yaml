services:
  app:
    image: ${DVM_IMAGE:-dvm:local}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${DVM_HTTP_PORT:-8080}:80"
    environment:
      DVM_TRUSTED_PROXIES: ${DVM_TRUSTED_PROXIES:-}
    volumes:
      - dvm:/var/lib/dvm
    depends_on:
      db:
        condition: service_healthy
  db:
    image: mysql:8.4@sha256:6ea90827b1100f8f2ae306a539f86d2c264a26ed435a2a9f75551dd5c3aeb242
    # DVM's database-local original-protection triggers need no global SUPER grant.
    command: ["--log-bin-trust-function-creators=1"]
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: dvm
      MYSQL_USER: dvm
      MYSQL_PASSWORD_FILE: /run/secrets/db_password
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/db_root_password
    secrets:
      - db_password
      - db_root_password
    volumes:
      - mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --silent"]
      interval: 5s
      timeout: 3s
      retries: 40
secrets:
  db_password:
    file: ${DVM_SECRETS_DIR:?Set DVM_SECRETS_DIR to an absolute private directory}/db-password
  db_root_password:
    file: ${DVM_SECRETS_DIR:?Set DVM_SECRETS_DIR to an absolute private directory}/db-root-password
volumes:
  dvm:
  mysql:
