<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bestätigungsdialog – synthetischer Test</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="form-validation.css"><link rel="stylesheet" href="dialogs.css"><script defer src="form-validation.js"></script><script defer src="dialogs.js"></script><script defer src="dialogs-ui.js"></script></head>
<body><main style="margin:0;padding:24px;max-width:950px"><section class="card"><h1>Bestätigungsdialog prüfen</h1><p>Nur synthetische Daten. Kein Serverversand, keine Löschung echter Daten.</p><button type="button" id="run">Prüfungen starten</button><pre id="results" role="status" style="white-space:pre-wrap"></pre></section>
<section class="card"><h2>Ansicht ausprobieren</h2><form id="example" data-confirm="Dieses unbenutzte Konto mit seinem Anfangssaldo endgültig löschen?"><label>Kontonamen zur Bestätigung eingeben<input name="confirm_name" value="Demokonto" required></label><button class="danger">Konto endgültig löschen</button></form><p id="example-status" role="status"></p></section><div id="fixtures"></div></main></body></html>
